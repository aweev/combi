version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck
    - cyclop
    - dupl
    - exhaustive
    - funlen
    - gocognit
    - goconst
    - gocritic
    - godot
    - gofmt
    - goimports
    - mnd
    - gosec
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - unconvert
    - unparam
    - whitespace
    - wrapcheck

linters-settings:
  funlen:
    lines: 80
    statements: 50
  cyclop:
    max-complexity: 12
  gosec:
    excludes:
      - G115  # integer overflow (too noisy on proto int conversions)
  goimports:
    local-prefixes: github.com/combi

issues:
  exclude-rules:
    - path: _test\.go
      linters: [funlen, dupl, mnd, gosec]
    - path: cmd/
      linters: [funlen]
