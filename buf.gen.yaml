version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/combi/gen/go
plugins:
  # Go types
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative

  # Go gRPC server/client stubs
  - remote: buf.build/grpc/go
    out: gen/go
    opt: paths=source_relative,require_unimplemented_servers=true

  # gRPC-Gateway (REST transcoding — for the HTTP gateway layer)
  - remote: buf.build/grpc-ecosystem/gateway
    out: gen/go
    opt: paths=source_relative

  # OpenAPI v2 spec (auto-generated API docs)
  - remote: buf.build/grpc-ecosystem/openapiv2
    out: gen/openapi

  # Protoc-validate (field-level validation rules in .proto files)
  - remote: buf.build/bufbuild/validate-go
    out: gen/go
    opt: paths=source_relative

  # TypeScript (Connect-ES — no grpc-web needed)
  - remote: buf.build/bufbuild/es
    out: gen/ts
    opt: target=ts

  # Python
  - remote: buf.build/protocolbuffers/python
    out: gen/python
